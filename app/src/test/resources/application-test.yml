# 集成测试专用配置（激活方式：@ActiveProfiles("test")）
#
# 只覆盖数据库名——指向独立的 test 库，不污染开发数据（ADR-0007）。
# 用户名与密码仍从环境变量读（.env），**不在这里写死**：这份文件是要入库的。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wingtisky_forum_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8

mybatis:
  configuration:
    # 集成测试里把 SQL 打出来：SQL 写错时的报错往往很笼统（"语法错误"），
    # 能看到实际执行的语句才定位得到。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.wingtisky.forum: debug
