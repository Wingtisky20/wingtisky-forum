server:
  port: 8080

spring:
  application:
    name: wingtisky-forum

  # ------------------------------------------------------------
  # 数据源
  #
  # 密码走环境变量且**没有默认值**：缺失时应用启动即失败，好过悄悄用一个
  # 可能不对的默认值连上去。这类"失败要失败得早且明显"的取舍，比"尽量能跑起来"
  # 更省排查时间。
  # ------------------------------------------------------------
  datasource:
    # 三个参数都不是随手加的，各有各的坑：
    #
    # · characterEncoding=**UTF-8，不是 utf8mb4**
    #   这个参数要的是 **Java 的字符集名**，而 utf8mb4 是 MySQL 的叫法。写 utf8mb4 会直接
    #   报 "Unsupported character encoding 'utf8mb4'" 启动失败。Connector/J 8+ 收到 UTF-8
    #   后会自行协商成 MySQL 侧的 utf8mb4 排序规则，不需要也不应该写 utf8mb4。
    #
    # · allowPublicKeyRetrieval=true
    #   MySQL 8 默认用 caching_sha2_password 认证插件，非 SSL 连接下首次认证需要向服务端
    #   索取公钥；不加会报 "Public Key Retrieval is not allowed"。
    #
    # · useSSL=false
    #   仅本地开发。生产必须开启 TLS（见 docs/06-runbook/local-setup.md §9）。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/wingtisky_forum?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:wingtisky}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: WtHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      # 3 秒。默认 30 秒会让"数据库连不上"表现为接口卡住半分钟，
      # 而不是立刻返回错误——排查时很难判断到底是哪里慢。
      connection-timeout: 3000

  # ------------------------------------------------------------
  # Redis
  #
  # M1 起有两处用它：刷新令牌的可撤销记录（认证）、限流计数（亮点 5）；
  # M3 起又多了两级缓存（亮点 1）与分布式锁。
  #
  # ⚠️ 2026-10-06 实测更正：这里原本写着「都只在需要时才连，因此本机没起 Redis 时，
  #    只要不碰这两个功能应用仍能启动」——**那句话现在是假的**。
  #
  #    M3 引入 Redisson 之后，它的自动配置**在启动时就要连上**，
  #    Redis 不可用时应用直接启动失败（实测：把端口指到一个没人听的端口）：
  #
  #      Failed to instantiate [org.redisson.api.RedissonClient]:
  #        RedisConnectionException: Unable to connect to Redis server: 127.0.0.1:6399
  #      → Application run failed
  #
  #    这是**接受下来的行为变更，不是漏修**。理由：
  #      · M3 起缓存、锁、令牌、限流全在 Redis 上，没有它应用本来就干不了活——
  #        "能启动"这个能力已经没有实际意义（启动了也是残废的）；
  #      · 保住它要多一条"锁不可用时如何降级"的路径，那是**新的失效面**，
  #        换回来的却是一个用不上的能力。
  #
  #    ⚠️ 与之相关但**不是**一回事：ADR-0014 的"限流在 Redis 不可用时放行"是
  #    **运行期**的降级——那个仍然成立，也仍然在做。这里说的是**启动期**依赖。
  # ------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 1 秒。默认值偏长，而 Redis 不可用时限流与令牌刷新都会卡住——
      # 快速失败并走降级路径，比让请求挂在那里好。
      timeout: 1s

# ------------------------------------------------------------
# JWT
#
# 这是"策略"不是"机制"，所以配置在业务侧而不是 wt-infra（architecture.md §4.3）。
# secret 来自环境变量、**没有默认值**：缺失即启动失败，好过用一个写死的默认密钥
# 悄悄跑起来——那等于所有人都能伪造令牌。
# ------------------------------------------------------------
wt:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 7d

  # ------------------------------------------------------------
  # 限流（亮点 5）
  #
  # ⚠️ 规则是**按顺序匹配、第一条命中生效**，因此具体路径必须排在通配前面——
  #    把 /api/** 放前面的话，登录接口就拿不到它自己的严格阈值了。
  #
  # ⚠️ 下面这些数字是**初始值**，M10 压测时校准。现在写死一个"看起来合理"的
  #    数字没有依据，所以放进配置，改的时候不用重新编译。
  # ------------------------------------------------------------
  rate-limit:
    enabled: true

    # ------------------------------------------------------------
    # 登录的「用户名维度」限流
    #
    # 它**不在下面的 rules 里**：那些规则由限流拦截器按"路径 + 方法"匹配，
    # 而拦截器拿不到请求体里的用户名（请求体是一次性的）。
    # 这一维度由 AuthService.login 自己读——那里用户名已经是方法参数。
    #
    # 与「按 IP 限登录」不是重复：
    #   按 IP     —— 挡"同一台机器试很多账号"
    #   按用户名  —— 挡"很多台机器试同一个账号"（撞库的经典形态）
    #
    # 它没有 fallback 配置项：Redis 挂掉时一律退回本地内存，不放行也不全拒。
    # （防撞库是这一维度限流的唯一目的，放行等于把门打开；全拒又谁都登不进来。）
    # ------------------------------------------------------------
    login-username:
      limit: 5
      window: 1m

    # ------------------------------------------------------------
    # 按路径 + 方法匹配的规则
    #
    # ⚠️ 两条顺序上的讲究，配错了不会报错、只会静默失效：
    #   1. **更具体的路径要写在前面**——`/api/auth/login` 必须排在 `/api/**` 之前
    #   2. 加了方法维度之后还多一层：`POST /api/posts`（发帖 10/分钟）必须排在
    #      `POST /api/**`（其余写接口 30/分钟）之前，否则后者会先命中
    #
    # ⚠️ 下面这些数字都是**初始值**，M10 压测时校准。
    #
    # ⚠️ `methods` 不填表示不限方法——但那种用法要小心：同一条路径上的读与写
    #    通常需要两套阈值，一条规则管两边必然顾此失彼。
    # ------------------------------------------------------------
    rules:
      # 登录与注册：按 IP 限。fallback 用 local 而不是 open——
      # 这类限流的**唯一目的就是防撞库**，Redis 挂了就全放行等于在最需要它的时候把门打开
      - path: /api/auth/login
        dimension: ip
        limit: 10
        window: 1m
        fallback: local
      - path: /api/auth/register
        dimension: ip
        limit: 10
        window: 1m
        fallback: local

      # 发帖：最重的写操作（要写正文、标签、计数），单独一档更严
      - path: /api/posts
        methods: [POST]
        dimension: user
        limit: 10
        window: 1m
        fallback: open

      # 其余写接口：评论、点赞、收藏、后台治理都落在这里
      - path: /api/**
        methods: [POST, PUT, PATCH, DELETE]
        dimension: user
        limit: 30
        window: 1m
        fallback: open

      # 读接口：按登录用户限。不用 IP 是因为同一个办公室共用一个出口 IP，
      # 按 IP 限会把无辜的人一起限掉。未登录时自动退回 IP。
      - path: /api/**
        methods: [GET]
        dimension: user
        limit: 100
        window: 1m
        fallback: open

  # ------------------------------------------------------------
  # 多级缓存（亮点 1）
  #
  # ⚠️ 这些数字是**初始值**，M10 压测时校准。与上面限流那段同理：
  #    校准是"试几组值比一比"的活，写死的话每改一次都要重新编译。
  #
  # ⚠️ `enabled` 不只是"出事时的紧急开关"，它是**闸门实验的分组开关**：
  #    实验要拿「纯 MySQL」与「三级缓存」两组比命中率和延迟，
  #    而两组必须是**同一份代码、只翻这一个开关**——否则差值里混着重构的影响，
  #    说明不了缓存的作用。所以它必须真的能关掉缓存，这条由
  #    `PostDetailCacheSwitchIntegrationTest` 对着真实 Redis 守着。
  #
  # 各档时长为什么是这个量级，见 `CachePolicy` 与 `CacheProperties` 的类注释。
  # ------------------------------------------------------------
  cache:
    post-detail:
      enabled: true
      l1-ttl: 45s            # 进程内那份。**必须短**：广播丢消息时靠它兜底
      l2-ttl: 5m             # Redis 里那份的基准值
      l2-ttl-jitter: 60s     # 实际 TTL = 5m + random(0, 60s)，防雪崩
      null-ttl: 60s          # "这篇帖子不存在"的墓碑。**必须短**
      lock-wait: 500ms       # 抢不到回源锁时最多等多久，超时降级回源
    view-count:
      flush-interval: 30s    # 浏览数从 Redis 回写进库的间隔

mybatis:
  # classpath*: 前缀支持从多个 jar 中加载 mapper XML（M2 之后会有多个模块各带自己的 XML）
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # user_name → userName 自动映射。不开启的话每个下划线字段都要手写 resultMap，
    # 而漏掉一个的后果是那个字段**静默为 null**——不会报错，只是数据不对。
    map-underscore-to-camel-case: true

logging:
  charset:
    # ⚠️ 必须显式指定。不写的话日志用**平台默认编码**——中文 Windows 上是 GBK，
    # 于是日志里的中文既 grep 不到、重定向出来看也是乱码。实测踩过：限流降级明明
    # 打了 15 条 ERROR，`grep 限流降级` 却是 0 条，一度被误导成"这里根本没打日志"。
    # UTF-8 也是 Linux/CI 的默认值，统一之后各处一致。
    # 交互式终端若显示乱码，执行 chcp 65001 切到 UTF-8 代码页即可。
    console: UTF-8
  pattern:
    # %X{traceId:-} 从 MDC 取 traceId，取不到时留空（:- 是默认值语法）。
    # 这一行是 TraceIdFilter 真正发挥价值的地方——没有它，traceId 只是个摆设。
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
